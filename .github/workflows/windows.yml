name: windows-desktop

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build:desktop
      - run: npm run smoke:desktop
      - run: npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: dnd-wormsboard-windows-x64
          path: release/DnD-WormsBoard-Setup-*.exe
          if-no-files-found: error
      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/DnD-WormsBoard-Setup-*.exe --clobber
