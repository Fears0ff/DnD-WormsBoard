# Replace dnd.example.com and both certificate paths before enabling this site.
server {
    listen 443 ssl;
    http2 on;
    server_name dnd.example.com;

    ssl_certificate     /etc/letsencrypt/live/dnd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnd.example.com/privkey.pem;

    # Base64 image uploads are larger than the original files.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the authenticated realtime endpoint at /ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

# Optional when port 80 is not already managed by another Nginx server block.
server {
    listen 80;
    server_name dnd.example.com;
    return 301 https://$host$request_uri;
}
